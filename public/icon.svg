<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a4d2a"/>
      <stop offset="100%" stop-color="#1e5c32"/>
    </linearGradient>
    <clipPath id="skylineClip">
      <circle cx="64" cy="50" r="14"/>
    </clipPath>
  </defs>

  <!-- Dark green rounded square background -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>

  <!-- Right O ring — lighter green -->
  <circle cx="64" cy="50" r="23" fill="#3d8a50" opacity="0.75"/>
  <!-- Inner cutout to make it a ring -->
  <circle cx="64" cy="50" r="14" fill="#1e5c32"/>

  <!-- City skyline clipped inside the O ring inner circle -->
  <g clip-path="url(#skylineClip)">
    <rect x="53" y="47" width="3.5" height="11" rx="0.5" fill="white" opacity="0.85"/>
    <rect x="57.5" y="43" width="3.5" height="15" rx="0.5" fill="white" opacity="0.92"/>
    <rect x="62" y="38" width="4" height="20" rx="0.5" fill="white"/>
    <rect x="67" y="42" width="3.5" height="16" rx="0.5" fill="white" opacity="0.92"/>
    <rect x="71.5" y="46" width="3" height="12" rx="0.5" fill="white" opacity="0.85"/>
  </g>

  <!-- Diagonal connector (the slash linking C to O, dark to mask overlap) -->
  <line x1="43" y1="30" x2="52" y2="70" stroke="#1a4d2a" stroke-width="7" stroke-linecap="round"/>

  <!-- White C — bold open arc, left half -->
  <path
    d="M 43 27
       A 23 23 0 1 0 43 73"
    stroke="white"
    stroke-width="9"
    stroke-linecap="round"
    fill="none"
  />
</svg>
