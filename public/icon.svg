<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none">
  <defs>
    <linearGradient id="leftCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a4d2a"/>
      <stop offset="100%" stop-color="#2d7a3a"/>
    </linearGradient>
    <linearGradient id="rightCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d7a3a"/>
      <stop offset="100%" stop-color="#5aad6a"/>
    </linearGradient>
    <clipPath id="leftClip">
      <circle cx="38" cy="40" r="34"/>
    </clipPath>
    <clipPath id="rightClip">
      <circle cx="82" cy="40" r="34"/>
    </clipPath>
  </defs>

  <!-- Left dark green circle -->
  <circle cx="38" cy="40" r="34" fill="url(#leftCircle)"/>

  <!-- Right light green circle -->
  <circle cx="82" cy="40" r="34" fill="url(#rightCircle)"/>

  <!-- Overlap region — blend by drawing left circle colour clipped to right -->
  <circle cx="38" cy="40" r="34" fill="#2d7a3a" clip-path="url(#rightClip)" opacity="0.6"/>

  <!-- Left circle inner white ring + C cutout -->
  <circle cx="38" cy="40" r="22" fill="none" stroke="white" stroke-width="5"/>
  <!-- C shape: arc from 60deg to 300deg (leaving a gap on the right) -->
  <path d="M 52 30 A 18 18 0 1 0 52 50" stroke="white" stroke-width="0" fill="none"/>
  <!-- White C letter -->
  <text x="29" y="47" font-family="Arial Black, sans-serif" font-size="26" font-weight="900" fill="white" opacity="0.0">C</text>
  <!-- Inner hollow circle for the C ring effect -->
  <circle cx="38" cy="40" r="14" fill="url(#leftCircle)"/>

  <!-- Right circle: bar chart / city skyline -->
  <g transform="translate(64, 26)">
    <!-- 5 bars of increasing height -->
    <rect x="2"  y="22" width="5" height="6"  rx="1" fill="white" opacity="0.9"/>
    <rect x="9"  y="16" width="5" height="12" rx="1" fill="white" opacity="0.9"/>
    <rect x="16" y="10" width="5" height="18" rx="1" fill="white" opacity="0.95"/>
    <rect x="23" y="14" width="5" height="14" rx="1" fill="white" opacity="0.9"/>
    <rect x="30" y="19" width="5" height="9"  rx="1" fill="white" opacity="0.9"/>
    <!-- Base line -->
    <line x1="0" y1="29" x2="38" y2="29" stroke="white" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Diagonal connector slash between the two circles -->
  <line x1="56" y1="18" x2="64" y2="62" stroke="white" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
</svg>
