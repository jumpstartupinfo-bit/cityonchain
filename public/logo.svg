<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" fill="none">
  <defs>
    <linearGradient id="lgLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a4d2a"/>
      <stop offset="100%" stop-color="#2d7a3a"/>
    </linearGradient>
    <linearGradient id="lgRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d7a3a"/>
      <stop offset="100%" stop-color="#5aad6a"/>
    </linearGradient>
    <clipPath id="rcClip">
      <circle cx="82" cy="40" r="34"/>
    </clipPath>
  </defs>

  <!-- Left dark green circle -->
  <circle cx="38" cy="40" r="34" fill="url(#lgLeft)"/>

  <!-- Right light green circle -->
  <circle cx="82" cy="40" r="34" fill="url(#lgRight)"/>

  <!-- Overlap blend -->
  <circle cx="38" cy="40" r="34" fill="#2d7a3a" clip-path="url(#rcClip)" opacity="0.5"/>

  <!-- Left: outer ring -->
  <circle cx="38" cy="40" r="22" fill="none" stroke="white" stroke-width="4.5" opacity="0.9"/>
  <!-- Left: inner fill to make ring hollow -->
  <circle cx="38" cy="40" r="14" fill="url(#lgLeft)"/>

  <!-- Right: city bar chart -->
  <g transform="translate(64, 26)">
    <rect x="2"  y="22" width="5" height="6"  rx="1" fill="white" opacity="0.9"/>
    <rect x="9"  y="16" width="5" height="12" rx="1" fill="white" opacity="0.9"/>
    <rect x="16" y="10" width="5" height="18" rx="1" fill="white" opacity="0.95"/>
    <rect x="23" y="14" width="5" height="14" rx="1" fill="white" opacity="0.9"/>
    <rect x="30" y="19" width="5" height="9"  rx="1" fill="white" opacity="0.9"/>
    <line x1="0" y1="29" x2="38" y2="29" stroke="white" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Diagonal slash connector -->
  <line x1="56" y1="18" x2="64" y2="62" stroke="white" stroke-width="2.5" opacity="0.65" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text
    x="130" y="50"
    font-family="'Space Grotesk', Arial Black, sans-serif"
    font-size="28"
    font-weight="700"
    fill="#111c11"
    letter-spacing="-0.5"
  >CityOnChain</text>
</svg>
